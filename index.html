<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini RTS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0d130b; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8efe2;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
    padding: 6px max(10px, env(safe-area-inset-left)); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: 0; padding-top: max(6px, env(safe-area-inset-top)); }
  #panel { bottom: 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .chip { background: rgba(10,16,8,.78); border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 6px 10px; font-weight: 600; font-size: 15px; }
  #credits { color: #ffd86b; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; pointer-events: none; }
  button { font: inherit; font-size: 15px; font-weight: 600; color: #e8efe2; background: #2c4a22;
    border: 1px solid #5b8a45; border-radius: 10px; padding: 9px 14px; min-height: 42px; }
  button:active { background: #3d6630; }
  button:disabled { opacity: .45; }
  button.ghost { background: rgba(10,16,8,.78); border-color: rgba(255,255,255,.18); }
  #info { font-weight: 500; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  #overlay h1 { margin: 0; font-size: 34px; }
  #overlay p { margin: 0; max-width: 460px; line-height: 1.4; opacity: .9; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="bar">
  <span id="credits" class="chip">$0</span>
  <span id="enemyInfo" class="chip"></span>
  <span class="spacer"></span>
  <button id="btnAll" class="ghost">Select soldiers</button>
  <button id="btnPause" class="ghost">❚❚</button>
</div>

<div id="panel" class="bar">
  <span id="info" class="chip">Tap your settler to begin</span>
  <button id="btnDeploy">Deploy HQ</button>
  <button id="btnBuild">Build Barracks $300</button>
  <button id="btnTrain">Train Soldier $100</button>
  <button id="btnCancel" class="ghost">Cancel</button>
  <span class="spacer"></span>
  <button id="btnDeselect" class="ghost">Deselect</button>
</div>

<div id="overlay">
  <h1 id="ovTitle">Mini RTS</h1>
  <p id="ovText"></p>
  <button id="ovBtn">Start</button>
</div>

<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
