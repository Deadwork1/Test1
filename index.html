<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini RTS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8efe2;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 6px;
    padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
    pointer-events: none; white-space: nowrap; }
  .bar > * { pointer-events: auto; flex-shrink: 0; }
  /* both bars scroll sideways when the buttons don't fit (narrow phones); no visible scrollbar */
  .bar { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; -webkit-overflow-scrolling: touch; }
  .bar::-webkit-scrollbar { display: none; }
  .bar > * { touch-action: pan-x; }
  #top { top: 0; padding-top: max(6px, env(safe-area-inset-top)); }
  #panel { bottom: 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); overflow-x: auto; }
  .chip { background: rgba(10,16,8,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 7px 10px; font-weight: 600; font-size: 14px; }
  #credits { color: #ffd86b; font-variant-numeric: tabular-nums; min-width: 70px; }
  #info { font-weight: 500; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1 1 auto !important; pointer-events: none; }
  button { font: inherit; font-size: 14px; font-weight: 600; color: #e8efe2; background: #2c4a22;
    border: 1px solid #5b8a45; border-radius: 10px; padding: 8px 12px; min-height: 40px; }
  button:active { background: #3d6630; }
  button:disabled { opacity: .45; }
  button.ghost { background: rgba(10,16,8,.82); border-color: rgba(255,255,255,.2); }
  button.on { background: #6b5a1a; border-color: #ffd86b; }
  #overlay, #pauseMenu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.7); flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  #overlay h1, #pauseMenu h1 { margin: 0; font-size: 32px; }
  #pauseMenu .col { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
  button.danger { background: #6b2020; border-color: #e06060; }
  #clock { font-variant-numeric: tabular-nums; color: #d8e4cf; }
  #overlay p { margin: 0; max-width: 520px; line-height: 1.45; opacity: .9; font-size: 15px; }
  #version { font-size: 13px; opacity: .6; margin-top: -8px; }
  #diffInfo, .sub { font-size: 13px; opacity: .75; margin-top: -6px; max-width: 460px; }
  #overlay { overflow-y: auto; }
  #overlay > * { flex-shrink: 0; }
  .row { display: flex; gap: 10px; }
  #notes { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.75); padding: 14px; }
  #notesBox { background: #141d11; border: 1px solid #5b8a45; border-radius: 14px; width: min(640px, 100%);
    max-height: 100%; display: flex; flex-direction: column; }
  #notesHead { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,.12); }
  #notesHead h2 { margin: 0; font-size: 20px; }
  #notesBody { overflow-y: auto; padding: 4px 18px 16px; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
  #notesBody h3 { margin: 16px 0 6px; font-size: 16px; color: #ffd86b; }
  #notesBody h3 small { color: #e8efe2; opacity: .6; font-weight: 500; margin-left: 6px; }
  #notesBody ul { margin: 0; padding-left: 20px; line-height: 1.45; font-size: 14px; }
  #notesBody li { margin: 3px 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="bar">
  <button id="btnPause" class="ghost">❚❚</button>
  <span id="credits" class="chip">$0</span>
  <span id="clock" class="chip" title="Time played">0:00</span>
  <span id="powerChip" class="chip" style="display:none;color:#ffde5a"></span>
  <span class="spacer"></span>
  <button id="btnMap" class="ghost">Map</button>
  <button id="btnBox" class="ghost">Box select</button>
  <button id="btnAll" class="ghost">Army</button>
</div>

<div id="panel" class="bar">
  <span id="info" class="chip">Tap your settler to begin</span>
  <button id="btnSell" class="ghost">Sell</button>
  <button id="btnDeploy">Deploy HQ</button>
  <button id="btnBarracks">Barracks $300</button>
  <button id="btnRefinery">Refinery $400</button>
  <button id="btnFactory">War Factory $500</button>
  <button id="btnTech">Tech Centre $600</button>
  <button id="btnPower">Power Plant $300</button>
  <button id="btnRadar">Radar $500</button>
  <button id="btnTower">Tower $500</button>
  <button id="btnWall">Wall $20</button>
  <button id="btnGate">Gate $150</button>
  <span id="produceBtns" style="display:contents"></span>
  <button id="btnHarvest">Auto-harvest</button>
  <button id="btnPlace">Place here</button>
  <button id="btnRotate" class="ghost">Rotate</button>
  <button id="btnCancel" class="ghost">Cancel</button>
  <span class="spacer"></span>
  <button id="btnDeselect" class="ghost">✕</button>
</div>

<div id="overlay">
  <h1 id="ovTitle">Mini RTS</h1>
  <div id="version"></div>
  <p id="ovText"></p>
  <div id="mapRow" class="row">
    <button class="ghost" data-m="classic">Classic map</button>
    <button class="ghost" data-m="large">Large map</button>
    <button class="ghost" data-m="huge">Huge map</button>
  </div>
  <div id="mapInfo" class="sub"></div>
  <div id="diffRow" class="row">
    <button class="ghost" data-d="easy">Easy</button>
    <button class="ghost" data-d="normal">Normal</button>
    <button class="ghost" data-d="hard">Hard</button>
  </div>
  <div id="diffInfo"></div>
  <div class="row">
    <button id="ovBtn">Start</button>
    <button id="ovNotes" class="ghost">Patch notes</button>
  </div>
</div>

<div id="pauseMenu">
  <h1>Paused</h1>
  <div class="col">
    <button id="pmResume">Resume</button>
    <button id="pmRestart" class="ghost">Restart</button>
    <button id="pmNotes" class="ghost">Patch notes</button>
  </div>
</div>

<div id="notes">
  <div id="notesBox">
    <div id="notesHead"><h2>Patch notes</h2><button id="notesClose" class="ghost">Close</button></div>
    <div id="notesBody"></div>
  </div>
</div>

<script>
  // If the game ever fails to load (say a phone runs out of memory on a big map), still show the start screen with
  // working map buttons, so you can always switch to another map.
  window.addEventListener('error', () => {
    if (window.gameLoaded) return;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('ovText').textContent = "This map couldn't load on this device. Pick another map:";
    for (const b of document.querySelectorAll('#mapRow button'))
      b.onclick = () => { try { localStorage.setItem('mini-rts-map', b.dataset.m); } catch (e) {} location.reload(); };
  });
</script>
<script src="patchnotes.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    // when a new version takes over, reload once so you're not left on the old one
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded || !navigator.serviceWorker.controller) return;
      reloaded = true;
      if (typeof game === 'undefined' || game.paused || !game.time) location.reload();
    });
  }
</script>
</body>
</html>
